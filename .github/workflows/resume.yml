permissions:
  contents: write

name: Sync Latest Resume from Machine

on:
  # push:
  #  paths:
  #   - 'resume.pdf'
  # schedule:
  #   - cron: "0 */6 * * *"   # every 6 hours
  #   - cron: "30 3 * * *"  # daily at 9am IST
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        
      - name: Updating with Latest resume
        run: ${{secrets.SYNC_RESUME}}
        
      - name: Sync Github
        run: |
          pwd
          ls -R
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add resume.pdf
          git commit -m "Auto-update resume"
          git push
