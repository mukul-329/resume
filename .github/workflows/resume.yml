permissions:
  contents: write

name: Sync Latest Resume from Machine

on:
  schedule:
    - cron: "*/5 * * * *"   # every 6 hours
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Updating with Latest resume
        run: ${{secrets.SYNC_RESUME}}
        
      - name: Sync Github
        run: |
          pwd
          ls -R
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add resume.pdf
          git diff --cached --quiet || git commit -m "Auto-update resume"
          git push
